name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
    paths:
      - '.github/workflows/**'
      - 'programs/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Anchor.toml'
      - 'package.json'
      - 'yarn.lock'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'programs/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Anchor.toml'
      - 'package.json'
      - 'yarn.lock'

env:
  SOLANA_VERSION: "v3.1.5"
  ANCHOR_VERSION: "0.31.1"
  SBF_TOOLS_VERSION: "v1.52"
  S3_CACHE_BUCKET: ${{ secrets.S3_CACHE_BUCKET }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: AnemoneCI-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      # Rust toolchain is read from rust-toolchain.toml (1.89.0)
      - name: Setup Rust toolchain
        run: rustup show

      - name: Restore Cargo registry from S3
        run: |
          KEY="cargo-registry-${{ hashFiles('**/Cargo.lock') }}"
          FALLBACK="cargo-registry-"
          aws s3 sync "s3://$S3_CACHE_BUCKET/cache/$KEY" ~/.cargo/registry/ 2>/dev/null || \
          aws s3 sync "s3://$S3_CACHE_BUCKET/cache/$FALLBACK" ~/.cargo/registry/ 2>/dev/null || \
          echo "No Cargo registry cache found — will build from scratch"

      - name: Restore program build artifacts from S3
        run: |
          KEY="cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'programs/**/*.rs') }}"
          FALLBACK="cargo-target-${{ runner.os }}-"
          aws s3 sync "s3://$S3_CACHE_BUCKET/cache/$KEY" target/ 2>/dev/null || \
          aws s3 sync "s3://$S3_CACHE_BUCKET/cache/$FALLBACK" target/ 2>/dev/null || \
          echo "No build artifact cache found — will build from scratch"

      - name: Install Solana CLI (Agave ${{ env.SOLANA_VERSION }})
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # Platform-tools v1.52 (rustc 1.89) required for edition2024 deps.
      # anchor build calls cargo-build-sbf in a way that tries to reinstall the
      # toolchain using the host cargo (1.84), which fails. Workaround: build
      # manually and run `anchor test --skip-build`.
      - name: Restore SBF platform-tools from S3
        run: |
          KEY="sbf-tools-${{ env.SBF_TOOLS_VERSION }}"
          aws s3 sync "s3://$S3_CACHE_BUCKET/cache/$KEY/solana" ~/.cache/solana/ 2>/dev/null && \
          aws s3 sync "s3://$S3_CACHE_BUCKET/cache/$KEY/rustup" \
            ~/.rustup/toolchains/1.89.0-sbpf-solana-${{ env.SBF_TOOLS_VERSION }}/ 2>/dev/null || \
          echo "No SBF tools cache found — will install from scratch"

      - name: Install SBF platform-tools ${{ env.SBF_TOOLS_VERSION }}
        run: cargo-build-sbf --tools-version ${{ env.SBF_TOOLS_VERSION }} --install-only

      - name: Install system dependencies
        run: sudo apt-get install -y libudev-dev

      - name: Restore Anchor (avm) from S3
        id: restore-anchor
        run: |
          if aws s3 sync "s3://$S3_CACHE_BUCKET/cache/anchor-avm-${{ env.ANCHOR_VERSION }}" \
              ~/.avm 2>/dev/null && [ -f ~/.avm/bin/anchor ]; then
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }}
        if: steps.restore-anchor.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/coral-xyz/avm avm --locked --force
          ~/.cargo/bin/avm install ${{ env.ANCHOR_VERSION }}
          ~/.cargo/bin/avm use ${{ env.ANCHOR_VERSION }}

      - name: Add Anchor to PATH
        run: echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Solana keypair
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json
          solana config set --url localhost

      # Re-patch the USDC mint fixture so mintAuthority matches the CI wallet.
      # The raw dump (usdc_mint.json) is committed; only the authority bytes change.
      - name: Patch USDC mint authority to CI wallet
        run: yarn ts-node tests/scripts/patch_usdc_mint.ts

      - name: Build program (cargo-build-sbf)
        run: cargo-build-sbf --tools-version ${{ env.SBF_TOOLS_VERSION }}

      - name: Generate IDL
        run: |
          mkdir -p target/idl
          anchor idl build -o target/idl/anemone.json

      - name: Run tests
        run: anchor test --skip-build

      # Save caches to S3 only on push to main to avoid cache poisoning from PRs
      - name: Save Cargo registry to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          KEY="cargo-registry-${{ hashFiles('**/Cargo.lock') }}"
          aws s3 sync ~/.cargo/registry/ "s3://$S3_CACHE_BUCKET/cache/$KEY" \
            --exclude "*.tmp" --no-progress

      - name: Save program build artifacts to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          KEY="cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'programs/**/*.rs') }}"
          aws s3 sync target/ "s3://$S3_CACHE_BUCKET/cache/$KEY" \
            --exclude "*.tmp" --no-progress

      - name: Save SBF platform-tools to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          KEY="sbf-tools-${{ env.SBF_TOOLS_VERSION }}"
          aws s3 sync ~/.cache/solana/ "s3://$S3_CACHE_BUCKET/cache/$KEY/solana" --no-progress
          aws s3 sync \
            ~/.rustup/toolchains/1.89.0-sbpf-solana-${{ env.SBF_TOOLS_VERSION }}/ \
            "s3://$S3_CACHE_BUCKET/cache/$KEY/rustup" --no-progress

      - name: Save Anchor (avm) to S3
        if: >
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          steps.restore-anchor.outputs.cache-hit != 'true'
        run: |
          aws s3 sync ~/.avm \
            "s3://$S3_CACHE_BUCKET/cache/anchor-avm-${{ env.ANCHOR_VERSION }}" --no-progress
